<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>Controlador Financeiro</h1>
        <form class="form-financeiro">
            <div class="descricao">
                <label for="add-descricao">Descrição:</label>
                <input type="text" id="add-descricao" name="descricao" required maxlength="50" placeholder="Descreva aqui.">
            </div>
            <div class="valor">
                <label for="add-valor">Valor:</label>
                <input type="number" id="add-valor" name="valor" step="0.01" min="0.01" max="100000" required placeholder="Digite o valor aqui."/>
            </div>
            <div class="tipo">
                <label for="add-tipo">Tipo:</label>
                <select id="add-tipo" name="tipo" required>
                    <option value="" disabled selected>Selecione o tipo de transação</option>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
            </div>
            <div class="categoria">
                <label for="add-categoria">Categoria:</label>
                <select id="add-categoria" name="categoria" required>
                    <option value="" disabled selected>Selecione uma categoria</option>
                    <option value="mercado">Mercado</option>
                    <option value="moradia">Moradia</option>
                    <option value="transporte">Transporte</option>
                    <option value="conta-luz">Conta de luz</option>
                    <option value="conta-internet">Conta de internet</option>
                    <option value="conta-gas">Conta de gás</option>
                    <option value="carro">Contas do carro</option>
                    <option value="celular1">Celular 1</option>
                    <option value="celular2">Celular 2</option>
                    <option value="assinaturas">Assinaturas</option>
                    <option value="esportes">Esportes</option>
                    <option value="lazer">Lazer</option>
                    <option value="escola">Escola</option>
                    <option value="outros">Outros</option>
                    <option value="salario1">Salário 1</option>
                    <option value="salario2">Salário 2</option>
                    <option value="cartao">Cartão de crédito</option>
                    <option value="imposto">Imposto</option>
                    <option value="emprestimo">Emprestimo</option>
                    <option value="saude">Saúde</option>
                </select>
            </div>
            <div class="data">
                <label for="add-data">Data:</label>
                <input id="add-data" type="date" name="data" required min="2000-01-01"/>
            </div>
            <div class="responsavel">
                <label for="add-responsavel">Responsável:</label>
                <select id="add-responsavel" name="responsavel" required>
                    <option value="" disabled selected>Selecione o responsável</option>
                    <option value="marido">Marido</option>
                    <option value="esposa">Esposa</option>
                </select>
            </div>
            <div class="button">
                <button type="submit" id="add-btn">Adicionar</button>
            </div>
        </form>
        <div class="resumo-financeiro">
            <div class="card-resumo">
                Total Receitas:<span id="total-receitas"></span>
            </div>
            <div class="card-resumo">
                Total Despesas:<span id="total-despesas"></span>
            </div>
            <div class="card-resumo">
                Saldo:<span id="saldo"></span>
            </div>
        </div>
        <div class="listagem">
            <div class="nucleo-financeiro">
                <h2>Marido</h2>
                <table id="listagem-table-marido" name="listagem-marido">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Responsável</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listagem-body-marido">
                        <!-- As linhas da tabela serão adicionadas dinamicamente aqui -->
                    </tbody>
                </table>
            </div>
            <div class="nucleo-financeiro">
                <h2>Esposa</h2>
                <table id="listagem-table-esposa" name="listagem-esposa">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Tipo</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Responsável</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listagem-body-esposa">
                        <!-- As linhas da tabela serão adicionadas dinamicamente aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
